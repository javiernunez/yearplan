name: Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-yearplan
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site to yearplan.sermestre.es
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/yearplan.sermestre.es' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || (echo "Missing DEPLOY_HOST (secret or variable)." && exit 1)
          test -n "${DEPLOY_USER}" || (echo "Missing DEPLOY_USER (secret or variable)." && exit 1)
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || (echo "Missing DEPLOY_SSH_KEY secret." && exit 1)
          echo "Deploy configuration looks good."

      - name: Rsync to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # --size-only: no re-subir ~2 GB solo porque el checkout de Actions tiene mtime distinto al VPS.
          # Sin --delete: PDFs solo en el VPS (CUENTOS ≥100 MiB) se conservan.
          rsync -rlvz --omit-dir-times --size-only \
            -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT} -o StrictHostKeyChecking=accept-new" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.DS_Store' \
            --exclude 'Abrir programacion.command' \
            --exclude '*.py' \
            --exclude '__pycache__/' \
            --exclude '_*/' \
            --exclude 'versions/' \
            --exclude 'programacion_index_BACKUP*.html' \
            --exclude 'NUEVOS POWERPOINTS/' \
            --exclude 'posters/' \
            --exclude 'EVALUATION/' \
            --exclude 'ls3_eco_adapt/' \
            --exclude 'YP PROGRAMACION SUPER FINAL.pdf' \
            --exclude 'GUION_YEAR_PLAN_20min_RECITABLE.*' \
            --exclude 'Padlet - *.xlsx' \
            --exclude '*.docx' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Verify on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -euxo pipefail
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            test -f "${DEPLOY_PATH}/index.html"
            test -f "${DEPLOY_PATH}/programacion_index.html"
            date -u "+[deploy] %Y-%m-%dT%H:%M:%SZ yearplan ready at ${DEPLOY_PATH}"
