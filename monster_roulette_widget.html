<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Activity Roulette Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="fonts/carla.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: transparent;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: .15rem;
}

.widget {
  position: relative;
  width: 100%;
  max-width: 230px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

/* Category selector — small pills */
.cat-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  justify-content: center;
  width: 100%;
}

.cat-pill {
  font-family: 'Fredoka One', cursive;
  font-size: .68rem;
  padding: 4px 9px;
  border-radius: 50px;
  border: 2px solid transparent;
  cursor: pointer;
  background: rgba(255,255,255,0.6);
  color: #555;
  transition: all .18s;
  line-height: 1;
}
.cat-pill:hover { transform: translateY(-1px); background: #fff; }
.cat-pill.active { color: #fff; }

/* Wheel */
.wheel-wrap {
  position: relative;
  width: min(210px, 60%);
  aspect-ratio: 1;
  flex-shrink: 0;
}

.pin {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 20px solid #1a1a2e;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  z-index: 10;
}

canvas { display: block; border-radius: 50%; width: 100%; height: 100%; }

/* Title strip — hidden, moved to spin button */
.cat-label {
  display: none;
  font-family: 'Fredoka One', cursive;
  font-size: clamp(.7rem, 3vw, .9rem);
  text-align: center;
  color: #1a1a2e;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
  letter-spacing: .3px;
  min-height: 1.4rem;
}

/* Spin button */
.spin-btn {
    font-family: var(--font-carla);
    font-size: clamp(1.15rem, 3.8vw, 1.38rem);
    padding: 5px 8px 5px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    color: #fff;
    transition: transform .1s, box-shadow .1s, opacity .15s;
    letter-spacing: -0.12em;
    word-spacing: 0.15em;
    line-height: 1.15;
}
.spin-btn:hover:not(:disabled) { transform: translateY(-2px); }
.spin-btn:active:not(:disabled) { transform: translateY(1px); }
.spin-btn:disabled { opacity: .4; cursor: not-allowed; }

/* Result popup — ocupa todo el iframe expandido */
.result-pop-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: transparent;
  z-index: 9998;
  pointer-events: none;
}
.result-pop-backdrop.show { display: block; }
.result-pop {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  border-radius: 0;
  border: none;
  box-shadow: none;
  overflow-y: auto;
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  display: none;
  flex-direction: column;
  justify-content: flex-start;
  z-index: 9999;
  padding: .75rem;
  box-sizing: border-box;
  pointer-events: auto;
}
.result-pop.show { display: flex; }
@keyframes popIn {
  from { opacity: 0; transform: scale(.94); }
  to   { opacity: 1; transform: scale(1); }
}
.rp-head {
  padding: .4rem 0 .3rem;
  display: flex; align-items: center; gap: 6px;
}
.rp-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.rp-name { font-family: var(--font-carla); font-size: 1.75rem; font-weight: 400; letter-spacing: var(--carla-letter-spacing); word-spacing: var(--carla-word-spacing); color: #1a1a2e; flex: 1; line-height: 1.2; }
.rp-sc {
  font-size: .65rem; font-weight: 800; padding: 3px 8px;
  border-radius: 50px; color: #fff; flex-shrink: 0;
  text-transform: uppercase; letter-spacing: .4px;
}
.rp-body {
  padding: .3rem 0 .5rem;
  font-size: 1.15rem;
  color: #445;
  line-height: 1.55;
  font-family: var(--font-carla);
  font-weight: 400;
  letter-spacing: var(--carla-letter-spacing);
  word-spacing: var(--carla-word-spacing);
}
.rp-author {
  display: inline-block;
  margin-top: .4rem;
  font-size: .64rem;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 50px;
}
.rp-close {
  position: absolute;
  top: 6px;
  right: 8px;
  background: none;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  color: #888;
  line-height: 1;
  padding: 4px;
}
.rp-close:hover { color: #333; }

/* Confetti */
.confetti-wrap {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 999;
}
.cdot {
  position: absolute;
  animation: fall 1.1s ease-in forwards;
}
@keyframes fall {
  0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(540deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="widget">
  <div class="cat-pills" id="catPills"></div>
  <div class="cat-label" id="catLabel"></div>
  <div class="wheel-wrap">
    <div class="pin"></div>
    <canvas id="wheel" width="210" height="210"></canvas>
  </div>
  <button class="spin-btn" id="spinBtn">🎲 Spin!</button>
</div><!-- end widget -->

<div class="result-pop-backdrop" id="resultBackdrop" aria-hidden="true"></div>
<div class="result-pop" id="resultPop" role="dialog" aria-modal="true">
    <button class="rp-close" id="rpClose" aria-label="Cerrar">✕</button>
    <div class="rp-head">
      <div class="rp-dot" id="rpDot"></div>
      <div class="rp-name" id="rpName"></div>
      <div class="rp-sc" id="rpSc"></div>
    </div>
    <div class="rp-body" id="rpBody"></div>
</div>

<div class="confetti-wrap" id="confWrap"></div>

      {n:"Sound Effects Story",sc:"",d:"__SOUNDFX__",auth:"",isSoundFx:true,stories:["🌩️ The Storm:\nIt was a quiet afternoon. Suddenly the wind started blowing through the trees 🔊. Leaves flew everywhere. Then the first drops of rain fell on the window 🔊. Slowly at first — drip, drip, drip 🔊. Then faster and faster and faster 🔊. A huge crack of thunder shook the walls 🔊. Lightning lit up the sky. The rain was pouring down now 🔊. Then slowly it stopped. One bird started singing 🔊. Then another 🔊. The sun came out.","🐄 The Farm:\nYou opened the big wooden gate and walked in 🔊. A dog ran up and barked at you 🔊. You walked past the cows — they looked at you and mooed 🔊. The sheep were in the field 🔊. A horse galloped past really fast 🔊. Then from the top of the barn, the cockerel crowed as loud as he could 🔊. Every single animal went quiet. Then they all started again at the same time 🔊.","🚗 The Car Journey:\nYou got in the car and closed the door 🔊. Dad turned the key and the engine started 🔊. You drove down the road — faster and faster 🔊. You stopped suddenly at the traffic lights 🔊. A big lorry beeped its horn right next to you 🔊. The lights turned green. You drove through a puddle 🔊. You went through a tunnel — everything went dark and echoey 🔊. Finally you arrived and everyone jumped out and slammed their doors 🔊.","🌴 The Jungle:\nYou pushed through the thick leaves and entered the jungle 🔊. Exotic birds were singing all around you 🔊. A monkey jumped from tree to tree above your head 🔊. You heard something hissing very close by 🔊 — you didn't look back. You started running 🔊. You splashed through a wide muddy river 🔊. Your feet squelched in the mud on the other side 🔊. You heard a lion roar in the distance 🔊. You climbed the nearest tree as fast as you could 🔊 and held on tight.","🍳 The Kitchen:\nMum was cooking dinner. The oil in the pan was sizzling loudly 🔊. She stirred the pot 🔊. The oven timer beeped three times 🔊. Something started boiling over 🔊. Then the smoke alarm went off 🔊! The dog woke up and started barking 🔊. The baby started crying 🔊. Dad ran in and opened the window 🔊. Everything went quiet. Then mum said — dinner is ready 🔊!","⚽ The Football Match:\nThe referee blew the whistle 🔊. Everyone ran onto the pitch 🔊. The crowd started cheering 🔊. Someone passed the ball 🔊. Another player kicked it really hard 🔊. It hit the post with a loud clang 🔊. The goalkeeper dived across the goal 🔊. The crowd gasped 🔊. Then — GOAL! Everyone screamed and jumped 🔊. Then the final whistle blew 🔊. One team cheered 🔊. The other team groaned 🔊.","🌲 The Forest at Night:\nYou walked slowly into the dark forest. Every step made the dry leaves crunch 🔊. An owl hooted somewhere above you 🔊. You stopped. A branch snapped nearby 🔊. You held your breath. Something moved in the bushes 🔊. You took one step back 🔊. Then another 🔊. Then you turned and ran as fast as you could 🔊 all the way home. You slammed the door shut 🔊. Your heart was pounding 🔊.","👶 The Baby:\nIt was the middle of the night. The baby woke up and started crying 🔊. Mum picked it up and rocked it 🔊 — shhhh shhhh shhhh 🔊. The baby hiccupped 🔊. Then it laughed 🔊. Then it sneezed three times in a row 🔊. Then it yawned a huge yawn 🔊 and started crying again 🔊. Dad came in rubbing his eyes 🔊. The baby looked at Dad — and laughed again 🔊. Then finally it closed its eyes and started snoring very quietly 🔊.","🐕 The Dog Walk:\nYou clipped on the lead and the dog immediately started barking with excitement 🔊. You walked down the street 🔊. The dog sniffed everything 🔊. Then it started to rain 🔊. First slowly, then really heavily 🔊. You started to run 🔊. The dog splashed through every single puddle on the way home 🔊. You arrived at the front door absolutely soaking wet 🔊. You opened the door and the dog shook itself 🔊 — water flew everywhere. You groaned 🔊.","🏫 The Classroom:\nThe bell rang loudly 🔊. Feet thundered down the corridor 🔊. The classroom door burst open 🔊. Everyone ran to their seats — chairs scraped across the floor 🔊, bags dropped with a thud 🔊, pencil cases clattered onto desks 🔊. Someone knocked over their water bottle 🔊. Someone else dropped their entire pencil case 🔊 — pens and pencils scattered everywhere. Then the teacher walked in. She clapped her hands twice 🔊. Complete silence. Then a phone beeped in someone's bag 🔊. Everyone turned to look."]},

function hexRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)}}

function sliceColors(hex,n){
  const b=hexRgb(hex),cols=[];
  for(let i=0;i<n;i++){
    const t=(i/n)*0.42;
    cols.push(`rgb(${Math.round(b.r+(255-b.r)*t)},${Math.round(b.g+(255-b.g)*t)},${Math.round(b.b+(255-b.b)*t)})`);
  }
  return cols;
}

function draw(a){
  const c=cats[cur],acts=c.acts,n=acts.length,cx=105,cy=105,r=100;
  const cols=sliceColors(c.color,n);
  ctx.clearRect(0,0,210,210);
  acts.forEach((act,i)=>{
    const s=a+i*(2*Math.PI/n)-Math.PI/2, e=s+2*Math.PI/n;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,e);ctx.closePath();
    ctx.fillStyle=cols[i];ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.65)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.save();
    ctx.translate(cx,cy);ctx.rotate(s+Math.PI/n);
    ctx.translate(r*0.62,0);ctx.rotate(Math.PI/2);
    ctx.fillStyle='rgba(255,255,255,0.96)';
    ctx.font='700 8.5px Nunito,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const words=act.n.split(' '),maxW=62;
    let lines=[],cur2='';
    words.forEach(w=>{const t=cur2?cur2+' '+w:w;if(ctx.measureText(t).width>maxW&&cur2){lines.push(cur2);cur2=w;}else cur2=t;});
    if(cur2)lines.push(cur2);
    const lh=10,sy=-((lines.length-1)*lh)/2;
    lines.forEach((l,li)=>ctx.fillText(l,0,sy+li*lh));
    ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,r+2,0,2*Math.PI);
  ctx.strokeStyle=c.dark;ctx.lineWidth=4;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,14,0,2*Math.PI);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle=c.dark;ctx.lineWidth=3;ctx.stroke();
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function burst(color){

  wrap.innerHTML='';

    const d=document.createElement('div');
    d.className='cdot';
    const sz=5+Math.random()*8;
    d.style.cssText=`left:${15+Math.random()*70}%;top:${Math.random()*25}%;width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'3px'};animation-delay:${Math.random()*.3}s;animation-duration:${.9+Math.random()*.5}s;`;
    wrap.appendChild(d);

  setTimeout(()=>{wrap.innerHTML='';},1600);
}

    else{p.style.background='rgba(255,255,255,0.6)';p.style.borderColor='transparent';}

}

const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function playTick(){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='sine';o.frequency.value=600;
  g.gain.value=0.03;
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.02);
  o.start();o.stop(audioCtx.currentTime+0.02);
}
function playTada(){
  const notes=[523,659,784,1047];
  notes.forEach((f,i)=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='triangle';o.frequency.value=f;
    g.gain.value=0.15;
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1*i+0.4);
    o.start(audioCtx.currentTime+0.1*i);
    o.stop(audioCtx.currentTime+0.1*i+0.4);
  });
}

spinBtn.onclick=()=>{
  if(spinning)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  spinning=true;spinBtn.disabled=true;
  const n=cats[cur].acts.length;
  const chosen=Math.floor(Math.random()*n);
  const slice=2*Math.PI/n;
  const target=-(chosen*slice+slice/2)+Math.PI/2;
  const final=target+(5+Math.random()*4)*2*Math.PI;
  const dur=3200,start=performance.now(),startA=angle;
  let lastTickAngle=angle;
  function frame(now){
    const t=Math.min((now-start)/dur,1),e=1-Math.pow(1-t,4);
    angle=startA+(final-startA)*e;draw(angle);
    const sliceAngle=2*Math.PI/n;
    if(Math.floor(angle/sliceAngle)!==Math.floor(lastTickAngle/sliceAngle)){playTick();}
    lastTickAngle=angle;
    if(t<1)requestAnimationFrame(frame);
    else{angle=final%(2*Math.PI);spinning=false;spinBtn.disabled=false;playTada();showResult(chosen);}
  }
  requestAnimationFrame(frame);
};

    b.className='cat-pill';
    b.textContent=c.emoji+' '+c.name;
    b.onclick=()=>select(i);
    pillBar.appendChild(b);
  });
  select(0);
}
