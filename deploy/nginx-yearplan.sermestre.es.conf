# Copy to the server, then:
#   sudo cp deploy/nginx-yearplan.sermestre.es.conf /etc/nginx/sites-available/yearplan.sermestre.es
#   sudo ln -sf /etc/nginx/sites-available/yearplan.sermestre.es /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yearplan.sermestre.es

server {
    listen 80;
    listen [::]:80;
    server_name yearplan.sermestre.es;

    root /opt/yearplan.sermestre.es;
    index index.html programacion_index.html;

    # Large classroom PDFs / images
    client_max_body_size 100M;

    # Tras crear .env en el VPS: bash scripts/sync-site-auth.sh
    # auth_basic "Monster Builders";
    # auth_basic_user_file /opt/yearplan.sermestre.es/deploy/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(pdf|png|jpe?g|gif|webp|mp3|mp4|woff2?|ttf|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
